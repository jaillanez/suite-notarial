name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + migraciones + tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales efímeras del contenedor de CI; no son secretos.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://suite_app:suite_app_dev@localhost:5432/suite_notarial
      PUBLIC_WEB_URL: http://localhost:5173
      JWT_SECRET: ci-secret-no-usar-en-produccion-0123456789abcdef
      DATA_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Librerías nativas (python-magic, weasyprint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 libpango-1.0-0 libpangoft2-1.0-0

      - name: Instalar backend
        run: make install-backend PYTHON=python

      - name: Crear rol y bases
        run: make db

      - name: Migraciones (upgrade, downgrade y upgrade de nuevo)
        working-directory: backend
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check

      - name: Lint (ruff + mypy)
        run: make lint-backend

      - name: Guardas print/float
        run: git ls-files -z -- 'backend/app/*.py' | xargs -0 python scripts/check_forbidden_tokens.py

      - name: Tests
        run: make test-backend
        env:
          DATABASE_URL: postgresql+asyncpg://suite_app:suite_app_dev@localhost:5432/suite_notarial_test

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar frontend
        run: make install-frontend

      - name: Lint (ESLint + Prettier + tsc)
        run: make lint-frontend

      - name: Tests
        run: make test-frontend

      - name: Build
        working-directory: frontend
        run: npm run build
