# nginx de la Suite Notarial (dentro del contenedor web). El TLS y el dominio los resuelve el
# Caddy compartido del servidor; acá solo se sirve la SPA y se pasa /api a la API interna.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Fotos del índice (hasta 6), comprobantes (10 MB) y documentos del sitio (25 MB).
    client_max_body_size 80m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # El Caddy ya pone la IP real del cliente; se reenvía tal cual para la auditoría.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # La lectura de fotos con IA externa puede tardar hasta 90 s.
        proxy_read_timeout 150s;
        proxy_request_buffering off;
    }

    # Archivos con hash en el nombre: se cachean para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rutas de la SPA: siempre index.html, sin cache para que cada deploy se vea al instante.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri /index.html;
    }
}
